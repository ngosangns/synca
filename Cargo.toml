[workspace]
resolver = "2"
members = [
  "crates/synca-core",
  "crates/synca-cli",
  "crates/synca-tui",
  "bin/synca",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
tempfile = "3"
walkdir = "2"
