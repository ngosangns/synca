name: desktop-macos

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test

  build:
    needs: test
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NATIVEPHP_APPLE_ID: ${{ secrets.NATIVEPHP_APPLE_ID }}
      NATIVEPHP_APPLE_ID_PASS: ${{ secrets.NATIVEPHP_APPLE_ID_PASS }}
      NATIVEPHP_APPLE_TEAM_ID: ${{ secrets.NATIVEPHP_APPLE_TEAM_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The bundled PHP binary matches the major.minor of the PHP that runs native:build.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Detect signing
        id: signing
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No MACOS_CERTIFICATE_P12_BASE64 secret; building an UNSIGNED app (not notarized, auto-update disabled)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "CSC_LINK=" >> "$GITHUB_ENV"
          fi
          if [ -z "$NATIVEPHP_APPLE_ID" ] || [ -z "$NATIVEPHP_APPLE_ID_PASS" ] || [ -z "$NATIVEPHP_APPLE_TEAM_ID" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/desktop-v') }}" = "true" ] && [ -n "$CSC_LINK" ]; then
              echo "::error::Signing certificate present but notarization secrets missing."
              exit 1
            fi
            echo "::warning::Notarization secrets missing; app will not be notarized."
          fi

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
      - run: npm ci

      - name: Prepare production .env (bundled into the app; no secrets)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i '' \
            -e 's/^APP_ENV=.*/APP_ENV=production/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e "s/^NATIVEPHP_APP_VERSION=.*/NATIVEPHP_APP_VERSION=${APP_VERSION}/" \
            -e "s/^NATIVEPHP_UPDATER_ENABLED=.*/NATIVEPHP_UPDATER_ENABLED=${{ steps.signing.outputs.signed }}/" \
            .env

      - name: Build (arm64 + x64)
        run: php artisan native:build mac all --no-interaction

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.APP_VERSION }}
          path: |
            desktop/nativephp/electron/dist/*.dmg
            desktop/nativephp/electron/dist/*.zip
            desktop/nativephp/electron/dist/*.blockmap
            desktop/nativephp/electron/dist/latest-mac.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/nativephp/electron/dist/*.dmg
            desktop/nativephp/electron/dist/*.zip
            desktop/nativephp/electron/dist/*.blockmap
            desktop/nativephp/electron/dist/latest-mac.yml
