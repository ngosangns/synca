name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Build
        working-directory: go
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: synca-cli
          path: go/bin/synca

  macos-app:
    needs: cli
    # Swift Testing needs Xcode 16+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synca-cli
          path: ${{ runner.temp }}/cli
      - name: Fetch ns-shell
        env:
          NS_SHELL_DEPLOY_KEY: ${{ secrets.NS_SHELL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$NS_SHELL_DEPLOY_KEY" > ~/.ssh/ns_shell
          chmod 600 ~/.ssh/ns_shell
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ns_shell -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:ngosangns/ns-shell.git "$GITHUB_WORKSPACE/../ns-shell"
      - name: Test (SyncaKit + end-to-end app tests against the real CLI, sandboxed HOME)
        working-directory: macos
        env:
          SYNCA_BIN: ${{ runner.temp }}/cli/synca
          # Mimic a small runner: one starved cooperative thread pool exposed a late-timeout bug.
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          chmod +x "$SYNCA_BIN"
          swift test
