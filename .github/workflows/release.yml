name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p synca

      - name: Package asset
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          ASSET="synca-v${VER}-darwin-arm64"
          BIN="target/release/synca"
          cp "$BIN" "$ASSET"
          chmod +x "$ASSET"
          shasum -a 256 "$ASSET" | awk '{print $1}' > "${ASSET}.sha256"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${ASSET}.sha256" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          cat "${ASSET}.sha256"

      - name: Create / upload GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          SHA="${{ steps.pkg.outputs.sha_file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$SHA" --clobber
          else
            gh release create "$TAG" "$ASSET" "$SHA" \
              --title "synca ${TAG}" \
              --notes "Release ${TAG}

## Install

\`\`\`bash
# via self-update (after first install)
synca update

# or manual
curl -L -o synca \\
  https://github.com/ngosangns/synca/releases/download/${TAG}/${ASSET}
chmod +x synca
mkdir -p ~/.local/share/synca/bin ~/.local/bin
cp synca ~/.local/share/synca/bin/synca-${{ steps.pkg.outputs.version }}
ln -sf ~/.local/share/synca/bin/synca-${{ steps.pkg.outputs.version }} ~/.local/bin/synca
\`\`\`

## Asset naming

- Binary: \`synca-vX.Y.Z-darwin-arm64\`
- Checksum: \`synca-vX.Y.Z-darwin-arm64.sha256\` (hex sha256 of the binary)
"
          fi
