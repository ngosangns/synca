version: '3'

# Thin wrapper over go/Makefile. The window is synca-gpui in apps/synca-gpui.

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install the CLI to ~/.local/bin
    cmds:
      - task: cli:install

  cli:build:
    desc: Build the Go CLI to go/bin/synca
    dir: go
    cmds:
      - make build

  cli:install:
    desc: Install the CLI to ~/.local/share/synca/bin and link ~/.local/bin/synca
    dir: go
    cmds:
      - make install

  cli:test:
    desc: Vet and test the Go CLI
    dir: go
    cmds:
      - go vet ./...
      - go test ./...

  test:
    desc: Vet and test the Go CLI
    cmds:
      - task: cli:test

  release:build:
    desc: Test and build the release asset in dist/ (no publish)
    cmds:
      - ./scripts/release-local.sh

  release:publish:
    desc: Test, build and publish the GitHub release for the Version const
    prompt: This creates or updates a public GitHub release. Continue?
    cmds:
      - ./scripts/release-local.sh --publish

  dev:install:
    desc: Build the GUI in apps/synca-gpui and install "Synca Dev.app" into ~/Applications
    cmds:
      - ../ns-gpui/scripts/install-dev.sh synca

  dev:install:all:
    desc: Install the synca CLI, then its Dev app
    cmds:
      - task: install
      - task: dev:install
